# A developer's machine: the mock source, bounds narrowed to resemble a desk's.
accrual:
  rate-lower-bound: 0.0050
  rate-upper-bound: 0.0800
  rounding-precision: 4

marketdata:
  source: mock

# infra/compose.yaml's Postgres. No defaults: a missing variable fails startup
# instead of connecting with a guessed credential.
spring:
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USER}
    password: ${LEDGER_DB_PASSWORD}
  # Stage 13: infra/compose.yaml's Keycloak, realm "ledger".
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:8180/realms/ledger/protocol/openid-connect/certs
  # Stage 7: synthetic counterparties and securities, so the endpoints can be tried by hand.
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local
  # Stage 9: infra/compose.yaml's Redis. The password comes from the environment (the same
  # infra/.env that compose reads); there is no default.
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${LEDGER_REDIS_PASSWORD}

# infra/compose.yaml's WireMock stub; the timeouts are the defaults from application.yml.
ledger:
  # The issuer is what the token's iss says; Keycloak puts the URL the token was requested at.
  security:
    issuer: http://127.0.0.1:8180/realms/ledger
  marketdata:
    base-url: http://127.0.0.1:8089
  # Stage 9: the quote cache is on for manual runs.
  cache:
    enabled: true
  # Stage 10: Kafka from infra/compose.yaml (plaintext, loopback: authentication is stage 13's).
  # The relay and the two consumers run in this process.
  messaging:
    enabled: true
    bootstrap-servers: 127.0.0.1:9092
  # Stage 11: batch on for manual runs. The timers are off: a manual run launches a job by name
  # (ledger.batch.command.job=accrual|reconciliation|retention) and exits, or leaves the
  # application running with ledger.batch.schedulers-enabled=true.
  batch:
    enabled: true

# Stage 12: infra/compose.yaml's Jaeger takes spans over OTLP/HTTP. Every request is sampled.
management:
  tracing:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:4318/v1/traces
