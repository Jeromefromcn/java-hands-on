# A developer's machine: the mock source, bounds narrowed to resemble a desk's.
accrual:
  rate-lower-bound: 0.0050
  rate-upper-bound: 0.0800
  rounding-precision: 4

marketdata:
  source: mock

# infra/compose.yaml's Postgres. No defaults: a missing variable fails startup
# instead of connecting with a guessed credential.
spring:
  datasource:
    url: ${LEDGER_DB_URL}
    username: ${LEDGER_DB_USER}
    password: ${LEDGER_DB_PASSWORD}
  # Stage 7: synthetic counterparties and securities, so the endpoints can be tried by hand.
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local

# infra/compose.yaml's WireMock stub; the timeouts are the defaults from application.yml.
ledger:
  marketdata:
    base-url: http://127.0.0.1:8089
