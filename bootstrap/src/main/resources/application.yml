spring:
  application:
    name: sl-ledger
  # Stage 7. Spring MVC's own exceptions (unknown path, wrong media type) answer as RFC 9457
  # ProblemDetail, like the ledger's. See docs/decisions/07-web.md.
  mvc:
    problemdetails:
      enabled: true
  # Stage 6. Flyway owns the schema; Hibernate only checks that the entities match it.
  # open-in-view off: a lazy association touched after the service returned is an error, not a
  # silent query issued outside any transaction. See docs/decisions/06-persistence.md.
  # No second-level cache: a per-node cache with no cross-node invalidation (stage 9).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        cache:
          use_second_level_cache: false

# Stage 12. Only what a probe or a scraper needs is exposed. env, beans and configprops are not:
# they print configuration, and the secrets in it, to anyone who can reach the port. Health details
# stay hidden until stage 13 puts authentication in front of them.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      # liveness: restarting the process is the only fix for what it can see, so nothing outside
      # the process is in it. readiness: what the instance cannot serve without, which is the
      # database and nothing else. Redis, Kafka and the market data source are degraded around (a
      # cache miss, an outbox that waits, a stale quote); one of them in this group would take every
      # instance out of rotation at once. See docs/decisions/12-resilience-observability.md.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

# Stage 12: on shutdown readiness goes REFUSING_TRAFFIC first, then in-flight requests finish. The
# Tomcat MBean registry feeds the thread and connection meters.
server:
  shutdown: graceful
  tomcat:
    mbeanregistry:
      enabled: true

# Stage 7: TraceIdFilter puts each request's id in the MDC; this prints it on every log line.
logging:
  pattern:
    correlation: "[%X{traceId:-}] "

# Synthetic values, wide enough to be safe defaults. Profiles narrow them.
accrual:
  rate-lower-bound: 0.0000
  rate-upper-bound: 0.2000
  rounding-precision: 2

marketdata:
  source: mock

ledger:
  return:
    max-attempts: 3
  # Stage 7: the external price source. Both timeouts are set on purpose: without a read timeout a
  # hanging source holds a Tomcat worker per request until the pool is gone. See
  # docs/decisions/07-web.md. Profiles point base-url at a real or stub source. Stage 12: connect
  # plus read (2.5 s) must fit inside the fan-out deadline (3 s), which TimeoutBudget checks at
  # start-up; a connect that takes half a second on a healthy network is already a failure.
  marketdata:
    base-url: http://127.0.0.1:8089
    connect-timeout: 500ms
    read-timeout: 2s
