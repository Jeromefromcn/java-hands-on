# Production-width bounds. marketdata.source selects the reference-rate stub (unscheduled);
# the price source is ledger.marketdata, whose URL has no default here.
accrual:
  rate-lower-bound: 0.0000
  rate-upper-bound: 0.1500
  rounding-precision: 2

marketdata:
  source: real

ledger:
  marketdata:
    base-url: ${LEDGER_MARKETDATA_URL}
  security:
    issuer: ${LEDGER_JWT_ISSUER}

# Stage 13: tokens come from the identity provider the environment names; the issuer claim must
# equal LEDGER_JWT_ISSUER exactly and the signing keys are fetched from LEDGER_JWK_SET_URI.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${LEDGER_JWK_SET_URI}

# Stage 12: probes and the scrape are served on their own port, which the edge does not route.
management:
  server:
    port: 8081
  # Stage 12: a tenth of requests are traced, and exported to the collector the environment names.
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${LEDGER_OTLP_TRACES_URL}

# Stage 12: one JSON object per log event, with the MDC (traceId, spanId) as fields, so the log
# pipeline reads a field and never parses text. Other profiles keep the readable pattern.
logging:
  structured:
    format:
      console: logstash
