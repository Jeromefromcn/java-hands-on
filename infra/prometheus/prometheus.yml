# Stage 12. Scrapes the ledger running on the host (./mvnw spring-boot:run with the local profile
# serves /actuator/prometheus on the application port) and evaluates the three alert rules.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sl-ledger
    metrics_path: /actuator/prometheus
    # Stage 13: the scrape needs the ledger-metrics role. A token from Keycloak by client
    # credentials, refreshed by Prometheus itself; the secret is a compose secret file.
    oauth2:
      client_id: prometheus
      client_secret_file: /run/secrets/prometheus_client_secret
      token_url: http://127.0.0.1:8180/realms/ledger/protocol/openid-connect/token
    static_configs:
      - targets: ["127.0.0.1:8080"]
