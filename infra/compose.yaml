# Postgres (stage 6 onward), a stub market data source (stage 7), Redis (stage 9), Kafka
# (stage 10), and Prometheus, Grafana and Jaeger (stage 12), for manual
# experiments. Automated tests never use this; they start their own
# Testcontainers instance.
#
#   cp infra/.env.example infra/.env   # then set real values
#   docker compose -f infra/compose.yaml up -d
#
# Bound to loopback only: the database is for this machine's experiments, not
# for the network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  # Stage 7: a stub market data source for manual runs. Fixed synthetic prices per ISIN prefix,
  # from infra/wiremock/mappings; no code, no credentials.
  marketdata:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # Stage 9: the shared cache tier, the rebuild lock and the invalidation channel. Password from
  # infra/.env, loopback only. No persistence: a cache and a lock lease are worth nothing after a
  # restart. Fencing tokens no longer live here: stage 11 draws them from a Postgres sequence (V11),
  # so a restart cannot lower one. See docs/decisions/09-caching.md.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}

  # Stage 10: a single-node Kafka in KRaft mode (no ZooKeeper), plaintext and loopback only;
  # broker authentication and TLS are outside stage 13 (see its decision record). One broker, so every topic has replication factor 1 and a broker
  # restart is an outage: this is for manual experiments, not a model of a cluster.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 20

  # Stage 13: the identity provider. Realm "ledger" is imported from infra/keycloak: five realm
  # roles, a public client for password-grant experiments from curl, a "prometheus" client with
  # client credentials, and synthetic users (trader1, ops1, auditor1, borrower1 for CP-001,
  # borrower2 for CP-002). Every secret in the realm file is a ${VAR} placeholder that Keycloak fills
  # from the environment at import; nothing is committed. Dev mode and plain HTTP on loopback:
  # tokens minted at http://127.0.0.1:8180/realms/ledger carry that issuer. Admin console on the
  # same port. Not a model of a production Keycloak (database, TLS, hostname, clustering).
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm", "--http-port=8180", "--hostname-strict=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in infra/.env}
      KC_USER_PASSWORD: ${KEYCLOAK_USER_PASSWORD:?set KEYCLOAK_USER_PASSWORD in infra/.env}
      PROMETHEUS_CLIENT_SECRET: ${PROMETHEUS_CLIENT_SECRET:?set PROMETHEUS_CLIENT_SECRET in infra/.env}
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/realm-ledger.json:/opt/keycloak/data/import/realm-ledger.json:ro

  # Stage 12: scrapes the ledger on the host (127.0.0.1:8080, /actuator/prometheus) and evaluates
  # infra/prometheus/alerts.yml. UI on http://127.0.0.1:9090. On the host's network, listening on
  # loopback only: a container on a compose network cannot reach a process on the host through
  # host.docker.internal when the host's firewall refuses traffic between bridges, which this
  # machine's does ("no route to host"). Linux only: Docker Desktop has no host networking.
  prometheus:
    image: prom/prometheus:v3.5.0
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:9090
    # Stage 13: the scrape needs the ledger-metrics role, so Prometheus fetches a token from Keycloak
    # with client credentials; the secret reaches it as a file the compose secret provides.
    secrets:
      - prometheus_client_secret
    volumes:
      # PROMETHEUS_CONFIG points at another scrape file when the ledger is not on port 8080.
      - ${PROMETHEUS_CONFIG:-./prometheus/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  # Stage 12: one provisioned data source (Prometheus) and one dashboard (infra/grafana). The admin
  # password is in infra/.env; there is no anonymous access. UI on http://127.0.0.1:3000. On the
  # host's network for the same reason as Prometheus, and loopback only.
  grafana:
    image: grafana/grafana:12.1.0
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in infra/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_HTTP_ADDR: 127.0.0.1
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Stage 12: traces. The ledger exports OTLP/HTTP to 127.0.0.1:4318 (local profile); the UI is on
  # http://127.0.0.1:16686. In-memory storage: traces are gone when it stops.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

secrets:
  prometheus_client_secret:
    environment: PROMETHEUS_CLIENT_SECRET

volumes:
  ledger-pgdata:
