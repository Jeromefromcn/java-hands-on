# Postgres (stage 6 onward), a stub market data source (stage 7), Redis (stage 9) and Kafka
# (stage 10), for manual
# experiments. Automated tests never use this; they start their own
# Testcontainers instance.
#
#   cp infra/.env.example infra/.env   # then set real values
#   docker compose -f infra/compose.yaml up -d
#
# Bound to loopback only: the database is for this machine's experiments, not
# for the network.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ledger-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 15

  # Stage 7: a stub market data source for manual runs. Fixed synthetic prices per ISIN prefix,
  # from infra/wiremock/mappings; no code, no credentials.
  marketdata:
    image: wiremock/wiremock:3.13.1
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # Stage 9: the shared cache tier, the rebuild lock and the invalidation channel. Password from
  # infra/.env, loopback only. No persistence: a cache and a lock lease are worth nothing after a
  # restart. The fencing counters are not: a restart resets them below what Postgres's write_fence
  # has admitted, and writes are then refused until write_fence is cleared. See
  # docs/decisions/09-caching.md.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/.env}

  # Stage 10: a single-node Kafka in KRaft mode (no ZooKeeper), plaintext and loopback only;
  # authentication is stage 13's. One broker, so every topic has replication factor 1 and a broker
  # restart is an outage: this is for manual experiments, not a model of a cluster.
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 20

volumes:
  ledger-pgdata:
